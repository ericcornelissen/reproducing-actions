name: Weekly
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch: ~

permissions: read-all

jobs:
  tooling:
    name: Update tooling
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Update tooling
        uses: ericcornelissen/tool-versions-update-action/pr@81ac98a712e6c292c2c623d092a61bbd7011575f # v2.2.3
        with:
          install-tools: false
